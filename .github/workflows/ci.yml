# Confere, a cada push e pull request, que o back-end passa nos testes e que o front-end compila.
# Os testes de integração (MD_INTEGRACAO=true) não rodam aqui: eles precisam do Oracle da FIAP.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Back-end (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testes unitários
        run: mvn -B -q test

  frontend:
    name: Front-end (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependências
        run: npm ci
      - name: Build
        run: npx vite build --outDir "$RUNNER_TEMP/dist"
