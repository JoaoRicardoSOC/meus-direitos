# Confere, a cada push e pull request, que o back-end passa nos testes, que o front-end compila
# e que a pasta frontend/dist versionada corresponde ao código.
# Os testes de integração (MD_INTEGRACAO=true) não rodam aqui: eles precisam do Oracle da FIAP.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Back-end (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testes unitários
        run: mvn -B -q test

  frontend:
    name: Front-end (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependências
        run: npm ci
      - name: Build
        run: npm run build
      # A dist é versionada (a entrega abre o index.html direto do disco). Se o build gerar algo
      # diferente do que está no git, alguém mudou o front e esqueceu de commitar a dist.
      - name: Dist versionada atualizada
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::frontend/dist está desatualizada. Rode npm run build e faça o commit da dist."
            git status --short -- dist
            exit 1
          fi
